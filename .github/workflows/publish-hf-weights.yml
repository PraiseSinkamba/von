name: Publish Option-Marker Weights to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-hf-release'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Download latest converged checkpoint from S3
        run: |
          mkdir -p /tmp/release_weights
          aws s3 cp s3://model-weight/von-option-marker-universal/option_marker.pt /tmp/release_weights/option_marker.pt
          aws s3 cp s3://model-weight/von-option-marker-universal/marker_calibration.json /tmp/release_weights/marker_calibration.json

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --with huggingface_hub python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)

          print("Publishing option_marker.pt (~1.5GB) to wfzyx/von...")
          api.upload_file(
              path_or_fileobj="/tmp/release_weights/option_marker.pt",
              path_in_repo="option_marker.pt",
              repo_id="wfzyx/von",
              commit_message="feat(model): release converged Option-Marker Universal weights (98.66% val, 72.0% v2 macro, 9.00 ViZDoom kills)"
          )

          print("Publishing marker_calibration.json to wfzyx/von...")
          api.upload_file(
              path_or_fileobj="/tmp/release_weights/marker_calibration.json",
              path_in_repo="marker_calibration.json",
              repo_id="wfzyx/von",
              commit_message="feat(model): update marker_calibration.json to converged Epoch 3 checkpoint"
          )
          print("Successfully published converged Option-Marker weights to Hugging Face Hub!")
          EOF
