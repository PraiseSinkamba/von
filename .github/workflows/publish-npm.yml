name: Publish to npm

# Ships the JS SDK in js/ to npm as von-sdk, kept in version lockstep with the
# Python SDK so a given tag means the same release on both registries.
#
# Auth is PyPI-style Trusted Publishing: npm exchanges the workflow's OIDC
# identity for a short-lived token, so there is no NPM_TOKEN to store, leak or
# rotate. It also gets provenance attestations for free.
#
# Configure once at npmjs.com -> von-sdk -> Settings -> Trusted Publisher:
#   Organization or user: wfzyx
#   Repository:           von
#   Workflow filename:    publish-npm.yml
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: js

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match js/package.json version $PKG."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: check
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if npm view "von-sdk@$PKG" version >/dev/null 2>&1; then
            echo "::warning::von-sdk $PKG is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        # npm >= 11.5.1 performs the OIDC exchange itself when id-token: write
        # is set; no NODE_AUTH_TOKEN is needed or wanted.
        if: steps.check.outputs.skip == 'false' && (startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm publish --access public
