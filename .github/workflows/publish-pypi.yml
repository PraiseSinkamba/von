name: Publish to PyPI

# Releases are cut by pushing a version tag:
#
#     git tag v1.1.1 && git push origin v1.1.1
#
# The tag is the single source of truth and is checked against pyproject.toml
# before anything is uploaded. PyPI releases are immutable -- a wrong version
# number cannot be taken back, only yanked -- so the mismatch check runs before
# the build rather than after.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not upload to PyPI"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG pyproject=$PROJECT"
          if [ "$TAG" != "$PROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PROJECT."
            echo "::error::Bump pyproject.toml or retag. PyPI uploads are irreversible."
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          # PyPI rejects duplicate versions with an opaque 400; fail early and say why.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/von-sdk/$PROJECT/json")
          if [ "$CODE" = "200" ]; then
            echo "::error::von-sdk $PROJECT is already on PyPI. Bump the version; releases are immutable."
            exit 1
          fi
          echo "version $PROJECT is free"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Smoke test the built wheel
        # A wheel that installs but cannot import is worse than no release,
        # because pip will happily serve it to everyone.
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import von
          from von.backends.option_marker_backend import _validate_calibration_map
          assert _validate_calibration_map({'bias': 1.0}) is not None
          assert _validate_calibration_map({'bias': 'nope'}) is None
          print('smoke ok')
          "

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN secret is not set."
            exit 1
          fi
          uv publish dist/*

      - name: Summary
        if: always()
        run: |
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          {
            echo "### von-sdk $PROJECT"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "https://pypi.org/project/von-sdk/$PROJECT/"
            else
              echo "Publish did not complete. Nothing was uploaded unless the Publish step itself failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
