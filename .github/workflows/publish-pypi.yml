name: Publish to PyPI

# Releases are cut by pushing a version tag:
#
#     git tag v1.1.1 && git push origin v1.1.1
#
# The tag is the single source of truth and is checked against pyproject.toml
# before anything is uploaded. PyPI releases are immutable -- a wrong version
# number cannot be taken back, only yanked -- so the mismatch check runs before
# the build rather than after.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not upload to PyPI"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI Trusted Publishing: GitHub mints a short-lived OIDC token per run and
      # PyPI exchanges it for a scoped, minutes-long upload token. No long-lived
      # API token is stored anywhere, so there is nothing to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG pyproject=$PROJECT"
          if [ "$TAG" != "$PROJECT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PROJECT."
            echo "::error::Bump pyproject.toml or retag. PyPI uploads are irreversible."
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          # PyPI rejects duplicate versions with an opaque 400; fail early and say why.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/von-sdk/$PROJECT/json")
          if [ "$CODE" = "200" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              # A dry run must still be able to exercise build + smoke-test on an
              # already-released version, so this is only advisory here.
              echo "::warning::von-sdk $PROJECT is already on PyPI; a real release would be rejected."
            else
              echo "::error::von-sdk $PROJECT is already on PyPI. Bump the version; releases are immutable."
              exit 1
            fi
          else
            echo "version $PROJECT is free"
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Smoke test the built wheel
        # A wheel that installs but cannot import is worse than no release,
        # because pip will happily serve it to everyone.
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import von
          from von.backends.option_marker_backend import _validate_calibration_map
          assert _validate_calibration_map({'bias': 1.0}) is not None
          assert _validate_calibration_map({'bias': 'nope'}) is None
          print('smoke ok')
          "

      - name: Verify trusted publishing is configured
        if: inputs.dry_run == true
        # A dry run cannot upload, so it verifies the next best thing: that PyPI
        # will actually exchange this workflow's OIDC identity for an upload
        # token. Without this, a misconfigured publisher only surfaces during a
        # real tagged release, when it is most expensive to discover.
        run: |
          set -euo pipefail
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          CODE=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$OIDC\"}")
          if [ "$CODE" != "200" ]; then
            echo "::error::PyPI refused to mint an upload token (HTTP $CODE). Check the trusted publisher on pypi.org: owner wfzyx, repo von, workflow publish-pypi.yml."
            python3 -c 'import json; print(json.load(open("/tmp/mint.json")))' || cat /tmp/mint.json
            exit 1
          fi
          rm -f /tmp/mint.json
          echo "trusted publishing OK: PyPI minted a scoped upload token"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false
        # No token: uv reads the GitHub OIDC identity and exchanges it with PyPI.
        run: uv publish --trusted-publishing always dist/*

      - name: Summary
        if: always()
        run: |
          PROJECT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          {
            echo "### von-sdk $PROJECT"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "https://pypi.org/project/von-sdk/$PROJECT/"
            else
              echo "Publish did not complete. Nothing was uploaded unless the Publish step itself failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
